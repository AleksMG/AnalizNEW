<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>NEURO HUNTER PRO — Autonomous Combat Simulation</title>
<style>
:root {
  --bg-deep: #050508;
  --bg-panel: #0a0a12;
  --border: #1a1a2e;
  --text-main: #e0e0e0;
  --text-dim: #6b7280;
  --accent-blue: #00f0ff;
  --accent-red: #ff2a2a;
  --accent-green: #00ff9d;
  --font-mono: 'SF Mono', 'Fira Code', monospace;
  --font-ui: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { 
  background: var(--bg-deep); 
  color: var(--text-main); 
  font-family: var(--font-ui); 
  overflow: hidden; 
  height: 100vh;
  width: 100vw;
}
#app { 
  display: grid; 
  grid-template-columns: 1fr 360px; 
  grid-template-rows: 56px 1fr; 
  height: 100%; 
  background: var(--bg-deep);
}
header { 
  grid-column: 1 / 3; 
  background: var(--bg-panel); 
  display: flex; 
  align-items: center; 
  padding: 0 24px; 
  gap: 24px; 
  border-bottom: 1px solid var(--border);
  z-index: 10;
}
h1 { font-size: 14px; color: var(--accent-blue); letter-spacing: 2px; font-weight: 800; text-transform: uppercase; }
.stat { font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 1px; }
.stat b { color: var(--text-main); font-family: var(--font-mono); font-weight: 600; margin-left: 4px; }
.spacer { flex: 1; }
.controls { display: flex; gap: 8px; align-items: center; }
button, select { 
  background: #11111a; 
  border: 1px solid var(--border); 
  color: var(--text-main); 
  padding: 8px 16px; 
  border-radius: 4px; 
  cursor: pointer; 
  font-size: 11px; 
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.5px;
  transition: all 0.2s ease; 
  font-family: var(--font-ui);
}
button:hover { border-color: var(--accent-blue); color: var(--accent-blue); }
button.primary { background: var(--accent-blue); border-color: var(--accent-blue); color: #000; }
button.primary:hover { background: #33f3ff; box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
button.danger { border-color: var(--accent-red); color: var(--accent-red); }
button.danger:hover { background: rgba(255, 42, 42, 0.1); }

#arena-wrap { 
  position: relative; 
  background: radial-gradient(circle at center, #0a0a14 0%, #050508 100%); 
  overflow: hidden; 
  border-right: 1px solid var(--border);
}
canvas { display: block; width: 100%; height: 100%; image-rendering: high-quality; }

#side { 
  background: var(--bg-panel); 
  padding: 16px; 
  overflow-y: auto; 
  font-size: 11px; 
  display: flex;
  flex-direction: column;
  gap: 16px;
}
.ptitle { 
  font-size: 10px; 
  text-transform: uppercase; 
  letter-spacing: 1.5px; 
  color: var(--text-dim); 
  font-weight: 700; 
  border-bottom: 1px solid var(--border);
  padding-bottom: 6px;
  margin-bottom: 8px;
}
.tank-card { 
  background: rgba(255,255,255,0.02); 
  border: 1px solid var(--border); 
  border-radius: 6px; 
  padding: 12px; 
  cursor: pointer; 
  transition: all 0.2s; 
}
.tank-card:hover { border-color: #333; background: rgba(255,255,255,0.04); }
.tank-card.sel { border-color: var(--accent-blue); background: rgba(0, 240, 255, 0.05); box-shadow: 0 0 0 1px rgba(0, 240, 255, 0.2); }
.tank-card.enemy.sel { border-color: var(--accent-red); background: rgba(255, 42, 42, 0.05); box-shadow: 0 0 0 1px rgba(255, 42, 42, 0.2); }

.tc-top { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; box-shadow: 0 0 8px currentColor; }
.tc-name { font-weight: 700; font-size: 12px; flex: 1; letter-spacing: 0.5px; }
.team-tag { font-size: 9px; font-weight: 800; padding: 2px 6px; border-radius: 3px; letter-spacing: 1px; }
.team-tag.blue { background: rgba(0, 240, 255, 0.15); color: var(--accent-blue); }
.team-tag.red { background: rgba(255, 42, 42, 0.15); color: var(--accent-red); }

.hp-bar { height: 4px; background: #1a1a2e; border-radius: 2px; overflow: hidden; margin: 6px 0; }
.hp-fill { height: 100%; border-radius: 2px; transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
.tc-row { display: flex; justify-content: space-between; color: var(--text-dim); font-size: 10px; line-height: 1.8; }
.tc-row b { color: var(--text-main); font-family: var(--font-mono); font-size: 10px; }

#brain-panel { 
  background: rgba(0,0,0,0.3); 
  border: 1px solid var(--border); 
  border-radius: 6px; 
  padding: 12px; 
  font-family: var(--font-mono); 
  font-size: 10px; 
}
.bp-section { margin-bottom: 12px; }
.bp-section:last-child { margin-bottom: 0; }
.bp-title { color: var(--text-dim); font-size: 9px; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 6px; font-weight: 700; }
.policy-row { display: flex; align-items: center; gap: 8px; margin: 3px 0; }
.policy-label { width: 80px; color: #9ca3af; font-size: 9px; flex-shrink: 0; }
.policy-bar { flex: 1; height: 6px; background: #1a1a2e; border-radius: 3px; overflow: hidden; position: relative; }
.policy-fill { height: 100%; border-radius: 3px; transition: width 0.15s ease-out; }
.policy-val { width: 40px; text-align: right; font-size: 9px; color: var(--text-dim); }
.policy-row.top .policy-fill { background: var(--accent-green); box-shadow: 0 0 6px rgba(0, 255, 157, 0.4); }
.policy-row.top .policy-label { color: var(--accent-green); font-weight: 700; }

#log { 
  font-family: var(--font-mono); 
  font-size: 10px; 
  color: var(--text-dim); 
  max-height: 160px; 
  overflow-y: auto; 
  line-height: 1.6; 
  background: rgba(0,0,0,0.2);
  padding: 8px;
  border-radius: 4px;
  border: 1px solid var(--border);
}
.log-k { color: var(--accent-red); }
.log-w { color: var(--accent-green); }
.log-s { color: var(--accent-blue); }
.log-l { color: #a855f7; }

#metrics { 
  background: rgba(0,0,0,0.3); 
  border: 1px solid var(--border); 
  border-radius: 6px; 
  padding: 10px; 
  font-size: 10px; 
  color: #9ca3af; 
  font-family: var(--font-mono);
}

/* Scrollbar styling */
::-webkit-scrollbar { width: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: #2a2a3e; border-radius: 3px; }
::-webkit-scrollbar-thumb:hover { background: #3a3a5e; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>⬡ Neuro Hunter Pro</h1>
    <div class="stat">Эпизод <b id="h-ep">1</b></div>
    <div class="stat">Раунд <b id="h-rnd">1</b></div>
    <div class="stat">FPS <b id="h-fps" style="color:var(--accent-green)">60</b></div>
    <div class="stat">Train <b id="h-train">0</b></div>
    <div class="spacer"></div>
    <div class="controls">
      <select id="sel-spd"><option value="1">1×</option><option value="2" selected>2×</option><option value="4">4×</option><option value="8">8×</option></select>
      <button class="primary" id="btn-go">▶ START</button>
      <button id="btn-train">🧠 TRAIN ×10</button>
      <button class="danger" id="btn-rst">↻ RESET</button>
    </div>
  </header>
  
  <div id="arena-wrap">
    <canvas id="c"></canvas>
  </div>
  
  <div id="side">
    <div>
      <div class="ptitle">Боевые единицы</div>
      <div id="tank-list"></div>
    </div>
    
    <div>
      <div class="ptitle">Нейро-мозг (Выбранный)</div>
      <div id="brain-panel"><div style="color:var(--text-dim); text-align:center; padding: 10px;">Выберите юнит для телеметрии</div></div>
    </div>
    
    <div>
      <div class="ptitle">Метрики PPO</div>
      <div id="metrics">Ожидание данных...</div>
    </div>
    
    <div>
      <div class="ptitle">Тактический журнал</div>
      <div id="log"></div>
    </div>
  </div>
</div>

<script>
'use strict';

/* ═══════════════════════════════════════════════════════════════════════
   1. CORE MATH & PHYSICS ENGINE (Fixed Timestep)
═══════════════════════════════════════════════════════════════════════ */
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;
const lerp = (a, b, t) => a + (b - a) * t;
const dist = (a, b) => Math.hypot(a.x - b.x, a.y - b.y);
const normAng = a => { a %= Math.PI * 2; if (a > Math.PI) a -= Math.PI * 2; if (a < -Math.PI) a += Math.PI * 2; return a; };
const angDiff = (a, b) => normAng(a - b);
const TAU = Math.PI * 2;
const EPS = 1e-8;

class Vector2 {
  constructor(x=0, y=0) { this.x = x; this.y = y; }
  add(v) { this.x += v.x; this.y += v.y; return this; }
  sub(v) { this.x -= v.x; this.y -= v.y; return this; }
  mult(s) { this.x *= s; this.y *= s; return this; }
  mag() { return Math.hypot(this.x, this.y); }
  normalize() { const m = this.mag(); if (m > 0) this.mult(1/m); return this; }
  copy() { return new Vector2(this.x, this.y); }
}

class SeededRNG {
  constructor(seed) { this.state = (seed >>> 0) || 1; }
  fork(extraSeed) { return new SeededRNG((this.state * 0x9E3779B1) ^ (extraSeed >>> 0)); }
  next() {
    let t = this.state += 0x6D2B79F5;
    t = Math.imul(t ^ t >>> 15, t | 1);
    t ^= t + Math.imul(t ^ t >>> 7, t | 61);
    this.state = (t ^ t >>> 14) >>> 0;
    return this.state / 4294967296;
  }
  gaussian(mean = 0, std = 1) {
    const u1 = Math.max(this.next(), EPS);
    const u2 = this.next();
    return Math.sqrt(-2 * Math.log(u1)) * Math.cos(TAU * u2) * std + mean;
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   2. NEURAL NETWORK (Optimized Float32)
═══════════════════════════════════════════════════════════════════════ */
class Linear {
  constructor(inF, outF, rng, scale = null) {
    this.inF = inF; this.outF = outF;
    this.W = new Float32Array(outF * inF);
    this.b = new Float32Array(outF);
    this.velW = new Float32Array(outF * inF);
    this.velB = new Float32Array(outF);
    const s = scale ?? Math.sqrt(2 / inF);
    for (let i = 0; i < this.W.length; i++) this.W[i] = (rng.next() * 2 - 1) * s;
    this.dW = new Float32Array(outF * inF);
    this.db = new Float32Array(outF);
    this.lastIn = null; this.lastPreAct = null;
  }
  forward(x) {
    this.lastIn = x;
    const out = new Float32Array(this.outF);
    const W = this.W, b = this.b, inF = this.inF, outF = this.outF;
    for (let o = 0; o < outF; o++) {
      let s = b[o]; const row = o * inF;
      for (let i = 0; i < inF; i++) s += W[row + i] * x[i];
      out[o] = s;
    }
    this.lastPreAct = out.slice();
    return out;
  }
  backward(dOut) {
    const x = this.lastIn, inF = this.inF, outF = this.outF;
    const W = this.W, dW = this.dW, db = this.db;
    const dIn = new Float32Array(inF);
    for (let o = 0; o < outF; o++) {
      const dout = dOut[o];
      db[o] += dout;
      const row = o * inF;
      for (let i = 0; i < inF; i++) {
        dW[row + i] += dout * x[i];
        dIn[i] += dout * W[row + i];
      }
    }
    return dIn;
  }
  apply(lr, momentum = 0.9, clipVal = 5) {
    const W = this.W, b = this.b, dW = this.dW, db = this.db;
    const velW = this.velW, velB = this.velB;
    let gn = 0;
    for (let i = 0; i < dW.length; i++) gn += dW[i] * dW[i];
    for (let i = 0; i < db.length; i++) gn += db[i] * db[i];
    gn = Math.sqrt(gn);
    const scale = gn > clipVal ? clipVal / gn : 1;
    for (let i = 0; i < W.length; i++) {
      velW[i] = momentum * velW[i] + dW[i] * scale;
      W[i] += lr * velW[i];
      dW[i] = 0;
    }
    for (let i = 0; i < b.length; i++) {
      velB[i] = momentum * velB[i] + db[i] * scale;
      b[i] += lr * velB[i];
      db[i] = 0;
    }
  }
  zeroGrad() { this.dW.fill(0); this.db.fill(0); }
}

const reluForward = x => { const o = new Float32Array(x.length); for (let i = 0; i < x.length; i++) o[i] = x[i] > 0 ? x[i] : 0; return o; };
const reluBackward = (preAct, dOut) => { const o = new Float32Array(preAct.length); for (let i = 0; i < preAct.length; i++) o[i] = preAct[i] > 0 ? dOut[i] : 0; return o; };
const softmax = x => {
  let max = -Infinity; for (let i = 0; i < x.length; i++) if (x[i] > max) max = x[i];
  const o = new Float32Array(x.length); let s = 0;
  for (let i = 0; i < x.length; i++) { o[i] = Math.exp(x[i] - max); s += o[i]; }
  for (let i = 0; i < x.length; i++) o[i] /= s;
  return o;
};

/* ═══════════════════════════════════════════════════════════════════════
   3. SENSOR & ENVIRONMENT
═══════════════════════════════════════════════════════════════════════ */
const MAX_ENEMIES = 4;
const MAX_ENEMY_FEATURES = 8;
const N_LIDAR = 8;
const SENSOR_DIM = 52;
const SELF_OFF = 0;
const ENEMY_OFF = 6;
const LIDAR_OFF = ENEMY_OFF + MAX_ENEMIES * MAX_ENEMY_FEATURES;
const BULLET_OFF = LIDAR_OFF + N_LIDAR;
const META_OFF = BULLET_OFF + 3;

function buildSensors(tank, tanks, bullets, walls, AW, AH) {
  const s = new Float32Array(SENSOR_DIM);
  s[SELF_OFF + 0] = tank.pos.x / AW * 2 - 1;
  s[SELF_OFF + 1] = tank.pos.y / AH * 2 - 1;
  s[SELF_OFF + 2] = tank.hp / tank.maxHp;
  s[SELF_OFF + 3] = tank.reload <= 0 ? 1 : tank.reload / tank.reloadTime;
  s[SELF_OFF + 4] = Math.cos(tank.angle);
  s[SELF_OFF + 5] = Math.sin(tank.angle);
  
  // Строгая фильтрация: только живые враги противоположной команды
  const enemies = tanks.filter(t => t.alive && t.team !== tank.team);
  const sorted = enemies.map(e => ({ e, d: dist(tank.pos, e.pos) })).sort((a, b) => a.d - b.d);
  const maxD = Math.hypot(AW, AH);
  
  for (let k = 0; k < MAX_ENEMIES; k++) {
    const off = ENEMY_OFF + k * MAX_ENEMY_FEATURES;
    const rec = sorted[k];
    if (rec) {
      const e = rec.e;
      s[off + 0] = (e.pos.x - tank.pos.x) / maxD;
      s[off + 1] = (e.pos.y - tank.pos.y) / maxD;
      s[off + 2] = 1.0; // Флаг наличия цели
      s[off + 3] = clamp(rec.d / maxD, 0, 1);
      s[off + 4] = clamp(e.vel.x / 3, -1, 1);
      s[off + 5] = clamp(e.vel.y / 3, -1, 1);
      s[off + 6] = e.hp / e.maxHp;
      const aimAtMe = Math.atan2(tank.pos.y - e.pos.y, tank.pos.x - e.pos.x);
      s[off + 7] = clamp(1 - Math.abs(angDiff(e.turret, aimAtMe)) / (Math.PI / 2), 0, 1);
    }
  }
  
  for (let i = 0; i < N_LIDAR; i++) {
    const a = tank.angle + (i / N_LIDAR) * TAU;
    const hit = raycastWalls(tank.pos, a, 160, walls, AW, AH);
    s[LIDAR_OFF + i] = clamp(hit / 160, 0, 1);
  }
  
  let threat = 0, dodgeX = 0, dodgeY = 0;
  for (const b of bullets) {
    if (b.team === tank.team) continue;
    const d = dist(b.pos, tank.pos);
    if (d > 180) continue;
    const toMe = { x: tank.pos.x - b.pos.x, y: tank.pos.y - b.pos.y };
    const dot = toMe.x * b.vel.x + toMe.y * b.vel.y;
    if (dot > 0) {
      const t = clamp(1 - d / 180, 0, 1);
      if (t > threat) {
        threat = t;
        const bl = Math.hypot(b.vel.x, b.vel.y) || 1;
        let dx = -b.vel.y / bl, dy = b.vel.x / bl;
        const side = toMe.x * dx + toMe.y * dy;
        if (side < 0) { dx = -dx; dy = -dy; }
        dodgeX = dx; dodgeY = dy;
      }
    }
  }
  s[BULLET_OFF + 0] = threat;
  s[BULLET_OFF + 1] = dodgeX;
  s[BULLET_OFF + 2] = dodgeY;
  
  s[META_OFF + 0] = clamp(nearestWallDist(tank.pos, walls) / 80, 0, 1);
  s[META_OFF + 1] = clamp(enemies.length / 6, 0, 1);
  s[META_OFF + 2] = tank.recentDamage > 0 ? clamp(tank.recentDamage / 30, 0, 1) : 0;
  
  return s;
}

function raycastWalls(pos, ang, maxD, walls, AW, AH) {
  const step = 6, dx = Math.cos(ang), dy = Math.sin(ang);
  for (let d = step; d <= maxD; d += step) {
    const x = pos.x + dx * d, y = pos.y + dy * d;
    if (x < 0 || x > AW || y < 0 || y > AH) return d;
    for (const w of walls) if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return d;
  }
  return maxD;
}
function nearestWallDist(pos, walls) {
  let best = 1e9;
  for (const w of walls) {
    const cx = clamp(pos.x, w.x, w.x + w.w), cy = clamp(pos.y, w.y, w.y + w.h);
    best = Math.min(best, Math.hypot(pos.x - cx, pos.y - cy));
  }
  return best;
}
function pointInWall(x, y, walls) {
  for (const w of walls) if (x >= w.x && x <= w.x + w.w && y >= w.y && y <= w.y + w.h) return true;
  return false;
}

/* ═══════════════════════════════════════════════════════════════════════
   4. POLICY NETWORK & PPO TRAINER
═══════════════════════════════════════════════════════════════════════ */
const EMBED_DIM = 64;
class Encoder {
  constructor(rng) {
    this.fc1 = new Linear(SENSOR_DIM, 96, rng);
    this.fc2 = new Linear(96, EMBED_DIM, rng);
    this.lastPreAct1 = null; this.lastPreAct2 = null;
  }
  forward(x) {
    const h1_pre = this.fc1.forward(x); this.lastPreAct1 = h1_pre;
    const h1 = reluForward(h1_pre);
    const h2_pre = this.fc2.forward(h1); this.lastPreAct2 = h2_pre;
    return reluForward(h2_pre);
  }
  backward(dOut) {
    const dh2 = reluBackward(this.lastPreAct2, dOut);
    const dh1 = this.fc2.backward(dh2);
    const dh1_act = reluBackward(this.lastPreAct1, dh1);
    return this.fc1.backward(dh1_act);
  }
  getLayers() { return [this.fc1, this.fc2]; }
}

const TACTICS_NAMES = ['АТАКА', 'ФЛАНГ-Л', 'ФЛАНГ-П', 'ДИСТАНЦИЯ', 'УКЛОН', 'ОТСТУП', 'УКРЫТИЕ', 'ПАТРУЛЬ'];
const N_TACTICS = 8;
const LOW_DIM = 5;

class PolicyNet {
  constructor(rng) {
    this.encoder = new Encoder(rng);
    this.policyFC = new Linear(EMBED_DIM, 96, rng);
    this.tacticsHead = new Linear(96, N_TACTICS, rng, 0.01);
    this.targetHead = new Linear(96 + MAX_ENEMY_FEATURES, 1, rng, 0.01);
    this.lowMeanHead = new Linear(96, LOW_DIM, rng, 0.01);
    this.lowLogStdHead = new Linear(96, LOW_DIM, rng, 0.01);
    for (let i = 0; i < LOW_DIM; i++) this.lowLogStdHead.b[i] = 0;
    this.valueHead = new Linear(96, 1, rng, 0.01);
    this.lastH = null; this.lastPreActPolicy = null;
  }
  
  forward(sensors, rng) {
    const emb = this.encoder.forward(sensors);
    const h_pre = this.policyFC.forward(emb);
    this.lastPreActPolicy = h_pre;
    const h = reluForward(h_pre);
    this.lastH = h;
    
    const tacticsLogits = this.tacticsHead.forward(h);
    const tacticsProbs = softmax(tacticsLogits);
    let r = rng.next(), cum = 0, tactic = 0;
    for (let i = 0; i < N_TACTICS; i++) { cum += tacticsProbs[i]; if (r <= cum) { tactic = i; break; } }
    
    const enemyFeatures = [];
    const targetScores = new Float32Array(MAX_ENEMIES);
    let validCount = 0;
    for (let k = 0; k < MAX_ENEMIES; k++) {
      const off = ENEMY_OFF + k * MAX_ENEMY_FEATURES;
      const isEnemy = sensors[off + 2] > 0.5;
      if (!isEnemy) { targetScores[k] = -100; enemyFeatures.push(null); continue; }
      const features = new Float32Array(MAX_ENEMY_FEATURES);
      for (let i = 0; i < MAX_ENEMY_FEATURES; i++) features[i] = sensors[off + i];
      enemyFeatures.push(features);
      const concat = new Float32Array(96 + MAX_ENEMY_FEATURES);
      for (let i = 0; i < 96; i++) concat[i] = h[i];
      for (let i = 0; i < MAX_ENEMY_FEATURES; i++) concat[96 + i] = features[i];
      targetScores[k] = this.targetHead.forward(concat)[0];
      validCount++;
    }
    
    const targetProbs = new Float32Array(MAX_ENEMIES);
    if (validCount > 0) {
      let maxS = -Infinity;
      for (let k = 0; k < MAX_ENEMIES; k++) if (targetScores[k] > maxS) maxS = targetScores[k];
      let sum = 0;
      for (let k = 0; k < MAX_ENEMIES; k++) {
        if (targetScores[k] > -50) { targetProbs[k] = Math.exp(targetScores[k] - maxS); sum += targetProbs[k]; }
      }
      if (sum > EPS) for (let k = 0; k < MAX_ENEMIES; k++) targetProbs[k] /= sum;
    }
    
    let targetIdx = 0;
    r = rng.next(); cum = 0;
    for (let k = 0; k < MAX_ENEMIES; k++) { cum += targetProbs[k]; if (r <= cum) { targetIdx = k; break; } }
    
    const lowMean = this.lowMeanHead.forward(h);
    const lowLogStd = this.lowLogStdHead.forward(h);
    const action = new Float32Array(LOW_DIM);
    const actionSamples = new Float32Array(LOW_DIM);
    let lowLogProb = 0;
    for (let i = 0; i < LOW_DIM; i++) {
      const std = Math.exp(clamp(lowLogStd[i], -5, 2));
      const sample = rng.gaussian(lowMean[i], std);
      actionSamples[i] = sample;
      action[i] = Math.tanh(sample);
      const logP = -0.5 * Math.log(2 * Math.PI) - lowLogStd[i] - 0.5 * ((sample - lowMean[i]) / std) ** 2;
      const correction = Math.log(1 - action[i] * action[i] + EPS);
      lowLogProb += logP - correction;
    }
    
    return {
      tactic, action, value: this.valueHead.forward(h)[0], tacticsProbs,
      targetIdx, targetScores, targetProbs, enemyFeatures, validCount,
      lowLogProb, lowMean, lowLogStd, actionSamples
    };
  }
  
  forwardValue(sensors) {
    const emb = this.encoder.forward(sensors);
    const h = reluForward(this.policyFC.forward(emb));
    return this.valueHead.forward(h)[0];
  }
  
  getLayers() {
    return [...this.encoder.getLayers(), this.policyFC, this.tacticsHead,
      this.targetHead, this.lowMeanHead, this.lowLogStdHead, this.valueHead];
  }
}

class TrajectoryBuffer {
  constructor(maxEpisodes = 40) { this.maxEpisodes = maxEpisodes; this.episodes = []; }
  addEpisode(transitions, bootstrapValue = 0) {
    if (transitions.length === 0) return;
    this.episodes.push({ transitions, bootstrapValue });
    while (this.episodes.length > this.maxEpisodes) this.episodes.shift();
  }
  sample(n) {
    if (this.episodes.length === 0) return [];
    const out = [];
    for (let i = 0; i < n; i++) out.push(this.episodes[(Math.random() * this.episodes.length) | 0]);
    return out;
  }
  size() { return this.episodes.reduce((s, e) => s + e.transitions.length, 0); }
  clear() { this.episodes = []; }
}

class PPOTrainer {
  constructor(policy, lr = 0.0004) {
    this.policy = policy; this.lr = lr;
    this.gamma = 0.995; this.lambda = 0.95; this.clipEps = 0.2;
    this.entropyCoef = 0.015; this.valueCoef = 0.5;
    this.epochs = 4; this.batchSize = 64;
    this.trainSteps = 0;
    this.lastMetrics = { policyLoss: 0, valueLoss: 0, entropy: 0, targetLoss: 0 };
  }
  
  computeGAE(transitions, bootstrapValue) {
    const T = transitions.length;
    const advantages = new Float32Array(T);
    const returns = new Float32Array(T);
    let gae = 0, nextV = bootstrapValue;
    for (let t = T - 1; t >= 0; t--) {
      const delta = transitions[t].reward + this.gamma * nextV - transitions[t].value;
      gae = delta + this.gamma * this.lambda * gae;
      advantages[t] = gae; returns[t] = gae + transitions[t].value;
      nextV = transitions[t].value;
    }
    return { advantages, returns };
  }
  
  // Асинхронный чанк для предотвращения блокировки UI
  trainStepAsync(buffer, maxTimeMs = 16) {
    return new Promise(resolve => {
      const startTime = performance.now();
      const episodes = buffer.sample(8);
      if (episodes.length === 0) { resolve(this.lastMetrics); return; }
      
      const all = [];
      for (const ep of episodes) {
        const { advantages, returns } = this.computeGAE(ep.transitions, ep.bootstrapValue);
        for (let t = 0; t < ep.transitions.length; t++) {
          all.push({ ...ep.transitions[t], advantage: advantages[t], return_: returns[t] });
        }
      }
      
      let amean = 0, avar = 0;
      for (const x of all) amean += x.advantage;
      amean /= all.length;
      for (const x of all) { const d = x.advantage - amean; avar += d * d; }
      const astdev = Math.sqrt(avar / all.length + EPS);
      for (const x of all) x.advantage = (x.advantage - amean) / astdev;
      
      let tPL = 0, tVL = 0, tEnt = 0, tTL = 0, count = 0;
      let epoch = 0, start = 0;
      
      const processBatch = () => {
        if (performance.now() - startTime > maxTimeMs || epoch >= this.epochs) {
          this.lastMetrics = {
            policyLoss: count ? tPL / count : 0,
            valueLoss: count ? tVL / count : 0,
            entropy: count ? tEnt / count : 0,
            targetLoss: count ? tTL / count : 0
          };
          resolve(this.lastMetrics);
          return;
        }
        
        if (start >= all.length) { epoch++; start = 0; 
          for (let i = all.length - 1; i > 0; i--) {
            const j = (Math.random() * (i + 1)) | 0;
            [all[i], all[j]] = [all[j], all[i]];
          }
        }
        
        const batch = all.slice(start, start + this.batchSize);
        start += this.batchSize;
        if (batch.length >= 4) {
          for (const L of this.policy.getLayers()) L.zeroGrad();
          for (const ex of batch) {
            const m = this._trainOne(ex);
            tPL += m.policy; tVL += m.value; tEnt += m.entropy; tTL += m.target; count++;
          }
          for (const L of this.policy.getLayers()) L.apply(this.lr, 0.9, 5);
          this.trainSteps++;
        }
        
        // Yield to browser
        setTimeout(processBatch, 0);
      };
      
      processBatch();
    });
  }
  
  _trainOne(ex) {
    const p = this.policy;
    const emb = p.encoder.forward(ex.state);
    const h_pre = p.policyFC.forward(emb);
    const h = reluForward(h_pre);
    p.lastH = h; p.lastPreActPolicy = h_pre;
    const adv = ex.advantage;
    
    // TACTICS
    const tacticsLogits = p.tacticsHead.forward(h);
    const newTacticsProbs = softmax(tacticsLogits);
    const ratio = newTacticsProbs[ex.tactic] / Math.max(ex.tacticsProbs[ex.tactic], EPS);
    const clippedRatio = clamp(ratio, 1 - this.clipEps, 1 + this.clipEps);
    const policyLoss = -Math.min(ratio * adv, clippedRatio * adv);
    const isTacticsClipped = (ratio < 1 - this.clipEps && adv > 0) || (ratio > 1 + this.clipEps && adv < 0);
    
    const dLogits = new Float32Array(N_TACTICS);
    if (!isTacticsClipped) {
      for (let j = 0; j < N_TACTICS; j++) {
        const dp_dlogit = newTacticsProbs[ex.tactic] * ((ex.tactic === j ? 1 : 0) - newTacticsProbs[j]);
        dLogits[j] += -adv * (ratio * dp_dlogit / newTacticsProbs[ex.tactic]);
      }
    }
    let entropy = 0;
    const dEntropy_dLogits = new Float32Array(N_TACTICS);
    for (let j = 0; j < N_TACTICS; j++) {
      let sum = 0;
      for (let i = 0; i < N_TACTICS; i++) {
        const pi = newTacticsProbs[i];
        sum += -(Math.log(pi + EPS) + 1) * pi * ((i === j ? 1 : 0) - newTacticsProbs[j]);
      }
      dEntropy_dLogits[j] = sum;
      entropy -= newTacticsProbs[j] * Math.log(newTacticsProbs[j] + EPS);
      dLogits[j] -= this.entropyCoef * dEntropy_dLogits[j];
    }
    const dh_tactics = p.tacticsHead.backward(dLogits);
    
    // TARGET
    const newScores = new Float32Array(MAX_ENEMIES);
    let validCount = ex.validCount || 0;
    for (let k = 0; k < MAX_ENEMIES; k++) {
      if (!ex.enemyFeatures || !ex.enemyFeatures[k]) { newScores[k] = -100; continue; }
      const concat = new Float32Array(96 + MAX_ENEMY_FEATURES);
      for (let i = 0; i < 96; i++) concat[i] = h[i];
      for (let i = 0; i < MAX_ENEMY_FEATURES; i++) concat[96 + i] = ex.enemyFeatures[k][i];
      newScores[k] = p.targetHead.forward(concat)[0];
    }
    const newTargetProbs = new Float32Array(MAX_ENEMIES);
    const oldTargetProbs = ex.targetProbs || new Float32Array(MAX_ENEMIES).fill(1 / MAX_ENEMIES);
    if (validCount > 0) {
      let maxN = -Infinity;
      for (let k = 0; k < MAX_ENEMIES; k++) if (newScores[k] > maxN) maxN = newScores[k];
      let sumN = 0;
      for (let k = 0; k < MAX_ENEMIES; k++) {
        if (newScores[k] > -50) { newTargetProbs[k] = Math.exp(newScores[k] - maxN); sumN += newTargetProbs[k]; }
      }
      if (sumN > EPS) for (let k = 0; k < MAX_ENEMIES; k++) newTargetProbs[k] /= sumN;
    }
    const targetRatio = newTargetProbs[ex.targetIdx] / Math.max(oldTargetProbs[ex.targetIdx], EPS);
    const targetClippedRatio = clamp(targetRatio, 1 - this.clipEps, 1 + this.clipEps);
    const targetLoss = -Math.min(targetRatio * adv, targetClippedRatio * adv);
    const isTargetClipped = (targetRatio < 1 - this.clipEps && adv > 0) || (targetRatio > 1 + this.clipEps && adv < 0);
    
    const dTargetScores = new Float32Array(MAX_ENEMIES);
    if (!isTargetClipped && validCount > 0 && newTargetProbs[ex.targetIdx] > 0.01) {
      for (let k = 0; k < MAX_ENEMIES; k++) {
        if (newTargetProbs[k] === 0) continue;
        const dp_dscore = newTargetProbs[ex.targetIdx] * ((ex.targetIdx === k ? 1 : 0) - newTargetProbs[k]);
        dTargetScores[k] = -adv * (targetRatio * dp_dscore / newTargetProbs[ex.targetIdx]);
      }
    }
    const dh_target = new Float32Array(96);
    for (let k = 0; k < MAX_ENEMIES; k++) {
      if (!ex.enemyFeatures || !ex.enemyFeatures[k] || dTargetScores[k] === 0) continue;
      const concat = new Float32Array(96 + MAX_ENEMY_FEATURES);
      for (let i = 0; i < 96; i++) concat[i] = h[i];
      for (let i = 0; i < MAX_ENEMY_FEATURES; i++) concat[96 + i] = ex.enemyFeatures[k][i];
      p.targetHead.forward(concat);
      const dConcat = p.targetHead.backward(new Float32Array([dTargetScores[k]]));
      for (let i = 0; i < 96; i++) dh_target[i] += dConcat[i];
    }
    
    // LOW-LEVEL
    const lowMean = p.lowMeanHead.forward(h);
    const lowLogStd = p.lowLogStdHead.forward(h);
    let lowLogProb = 0;
    const dMean = new Float32Array(LOW_DIM);
    const dLogStd = new Float32Array(LOW_DIM);
    for (let i = 0; i < LOW_DIM; i++) {
      const std = Math.exp(clamp(lowLogStd[i], -5, 2));
      const z = (ex.actionSamples[i] - lowMean[i]) / std;
      lowLogProb += -0.5 * Math.log(2 * Math.PI) - lowLogStd[i] - 0.5 * z * z + Math.log(1 - ex.action[i] * ex.action[i] + EPS);
      dMean[i] = z / std;
      dLogStd[i] = z * z - 1;
    }
    const lowRatio = Math.exp(clamp(lowLogProb - ex.lowLogProb, -10, 10));
    const lowClippedRatio = clamp(lowRatio, 1 - this.clipEps, 1 + this.clipEps);
    const lowPolicyLoss = -Math.min(lowRatio * adv, lowClippedRatio * adv);
    const isLowClipped = (lowRatio < 1 - this.clipEps && adv > 0) || (lowRatio > 1 + this.clipEps && adv < 0);
    const gradScale = isLowClipped ? 0 : -adv * lowRatio;
    for (let i = 0; i < LOW_DIM; i++) { dMean[i] *= gradScale; dLogStd[i] *= gradScale; }
    
    const dh_lowMean = p.lowMeanHead.backward(dMean);
    const dh_lowLogStd = p.lowLogStdHead.backward(dLogStd);
    
    // VALUE
    const newValue = p.valueHead.forward(h)[0];
    const valueLoss = (newValue - ex.return_) ** 2;
    const dh_value = p.valueHead.backward(new Float32Array([2 * this.valueCoef * (newValue - ex.return_)]));
    
    // COMBINE
    const dh = new Float32Array(96);
    for (let i = 0; i < 96; i++) dh[i] = dh_tactics[i] + dh_target[i] + dh_lowMean[i] + dh_lowLogStd[i] + dh_value[i];
    p.policyFC.backward(reluBackward(h_pre, dh));
    p.encoder.backward(dh);
    
    return { policy: policyLoss + lowPolicyLoss, value: valueLoss, entropy, target: targetLoss };
  }
}

/* ═══════════════════════════════════════════════════════════════════════
   5. COMBAT AI CORE (Advanced Steering & Prediction)
═══════════════════════════════════════════════════════════════════════ */
class CombatCore {
  constructor() { this.targetAssignments = new Map(); }
  
  calculateLeadShot(shooter, target, bulletSpeed) {
    let t = dist(shooter.pos, target.pos) / bulletSpeed;
    let predX = target.pos.x + target.vel.x * t;
    let predY = target.pos.y + target.vel.y * t;
    for (let i = 0; i < 3; i++) {
      const newDist = Math.hypot(predX - shooter.pos.x, predY - shooter.pos.y);
      const newT = newDist / bulletSpeed;
      predX = target.pos.x + target.vel.x * newT;
      predY = target.pos.y + target.vel.y * newT;
    }
    return Math.atan2(predY - shooter.pos.y, predX - shooter.pos.x);
  }
  
  assessThreatLevel(tank, enemy) {
    let threat = 0;
    const d = dist(tank.pos, enemy.pos);
    threat += Math.max(0, 1 - d / 500) * 30;
    const aimAtMe = Math.atan2(tank.pos.y - enemy.pos.y, tank.pos.x - enemy.pos.x);
    threat += Math.max(0, 1 - Math.abs(angDiff(enemy.turret, aimAtMe)) / 0.5) * 40;
    threat += (1 - enemy.hp / enemy.maxHp) * 15;
    
    let assignedCount = 0;
    this.targetAssignments.forEach((enemyId) => { if (enemyId === enemy.id) assignedCount++; });
    threat -= assignedCount * 8;
    
    const relativeVel = { x: enemy.vel.x - tank.vel.x, y: enemy.vel.y - tank.vel.y };
    const approachSpeed = -(relativeVel.x * Math.cos(aimAtMe) + relativeVel.y * Math.sin(aimAtMe));
    threat += Math.max(0, approachSpeed / 3) * 15;
    return Math.max(0, threat);
  }
  
  assignTargetsGlobal(tanks) {
    const alive = tanks.filter(t => t.alive);
    const enemies = alive.filter(t => t.team === 'red');
    const allies = alive.filter(t => t.team === 'blue');
    if (enemies.length === 0 || allies.length === 0) return new Map();
    
    const pairs = [];
    for (const ally of allies) {
      for (const enemy of enemies) {
        pairs.push({ threat: this.assessThreatLevel(ally, enemy), allyId: ally.id, enemyId: enemy.id });
      }
    }
    pairs.sort((a, b) => b.threat - a.threat);
    
    const assignments = new Map();
    const usedEnemies = new Set(), usedAllies = new Set();
    for (const pair of pairs) {
      if (!usedAllies.has(pair.allyId) && !usedEnemies.has(pair.enemyId)) {
        assignments.set(pair.allyId, pair.enemyId);
        usedAllies.add(pair.allyId); usedEnemies.add(pair.enemyId);
      }
    }
    return assignments;
  }
  
  isLineOfSightClear(tank, target, tanks) {
    const angleToTarget = Math.atan2(target.pos.y - tank.pos.y, target.pos.x - tank.pos.x);
    return !tanks.some(t => {
      if (t.id === tank.id || !t.alive || t.team !== tank.team) return false;
      const dToAlly = dist(tank.pos, t.pos);
      const dToTarget = dist(tank.pos, target.pos);
      if (dToAlly > dToTarget) return false;
      const angleToAlly = Math.atan2(t.pos.y - tank.pos.y, t.pos.x - tank.pos.x);
      return Math.abs(angDiff(angleToAlly, angleToTarget)) < 0.15;
    });
  }
}

    this.respawn = 0;
    this.kills = 0; this.deaths = 0; this.damage = 0; this.shots = 0; this.hits = 0; this.wins = 0;
    this.trail = []; this.wanderAng = rng.next() * TAU;
    this.currentTarget = null;
    this.lastTactic = 0; this.lastAction = new Float32Array(LOW_DIM);
    this.lastTacticsProbs = new Float32Array(N_TACTICS);

const sim = {
  AW: 1100, AH: 760,
  tanks: [], bullets: [], walls: [],
  tick: 0, round: 1, episode: 0,
  running: false, speed: 2,
  tankCount: 6, selected: 0,
  trajectoryBuffer: new TrajectoryBuffer(40),
  log: [], rng: new SeededRNG(Date.now()),
  combatCore: new CombatCore(),
  accumulator: 0,
  lastTime: 0
};

let sharedPolicy = null, trainer = null;

/* ═══════════════════════════════════════════════════════════════════════
   7. CORE SIMULATION LOOP (Fixed Timestep)
═══════════════════════════════════════════════════════════════════════ */
function initBrain() {
  const rng = new SeededRNG(Date.now());
  sharedPolicy = new PolicyNet(rng);
  trainer = new PPOTrainer(sharedPolicy, 0.0004);
}

function genWalls(rng) {
  const walls = []; const n = 6;
  for (let i = 0; i < n; i++) {
    const w = 60 + rng.next() * 120, h = 14 + rng.next() * 18;
    const horizontal = rng.next() > 0.5;
    walls.push({ 
      x: 70 + rng.next() * (sim.AW - 140 - (horizontal ? w : h)), 
      y: 70 + rng.next() * (sim.AH - 140 - (horizontal ? h : w)), 
      w: horizontal ? w : h, h: horizontal ? h : w 
    });
  }
  return walls;
}

function findSpawn(rng) {
  for (let i = 0; i < 80; i++) {
    const x = 70 + rng.next() * (sim.AW - 140), y = 70 + rng.next() * (sim.AH - 140);
    if (!pointInWall(x, y, sim.walls)) {
      let ok = true;
      for (const t of sim.tanks) if (t.alive && dist(t.pos, {x, y}) < 120) { ok = false; break; }
      if (ok) return { x, y };
    }
  }
  return { x: sim.AW / 2, y: sim.AH / 2 };
}

function initRound() {
  sim.bullets = [];
  sim.walls = genWalls(sim.rng.fork(sim.round * 31 + 7));
  sim.tanks = [];
  sim.combatCore.targetAssignments.clear();
  const names = ['ALPHA', 'BRAVO', 'CHARLIE', 'DELTA', 'ECHO', 'FOXTROT'];
  for (let i = 0; i < sim.tankCount; i++) {
    const pos = findSpawn(sim.rng);
    sim.tanks.push(new Tank(i, names[i], i < 3 ? 'blue' : 'red', pos, sim.rng));
  }
  addLog(`Раунд ${sim.round} начался. ${sim.tankCount} единиц.`, 'log-s');
}

function addLog(msg, cls) {
  sim.log.unshift({ t: sim.tick, msg, cls: cls || '' });
  if (sim.log.length > 50) sim.log.pop();
}

const R_LIFE = 0.001, R_AIM = 0.003, R_DIST = 0.002, R_DODGE = 0.04;
const R_HIT = 1.5, R_KILL = 3.0, R_DAMAGE = -0.01, R_DEATH = -10.0, R_WIN = 5.0;

function updatePhysics(dt) {
  sim.tick++;
  const alive = sim.tanks.filter(t => t.alive);
  
  if (alive.length <= 1) {
    if (alive.length === 1) { addLog(`🏆 ${alive[0].name} УНИЧТОЖИЛ ПРОТИВНИКА`, 'log-w'); alive[0].wins++; }
    endRound();
    return;
  }
  
  for (const t of sim.tanks) if (t.alive) t.recentDamage *= 0.9;
  if (sim.tick % 20 === 0) sim.combatCore.targetAssignments = sim.combatCore.assignTargetsGlobal(sim.tanks);
  
  for (const tank of sim.tanks) {
    if (!tank.alive) { if (--tank.respawn <= 0) respawn(tank); continue; }
    if (tank.reload > 0) tank.reload--;
    
    const sensors = buildSensors(tank, sim.tanks, sim.bullets, sim.walls, sim.AW, sim.AH);
    const decision = sharedPolicy.forward(sensors, tank.rng);
    
    const assignedEnemyId = sim.combatCore.targetAssignments.get(tank.id);
    let target = assignedEnemyId !== undefined ? sim.tanks.find(t => t.alive && t.id === assignedEnemyId) : null;
    if (!target) {
      const enemies = sim.tanks.filter(t => t.alive && t.team !== tank.team).map(e => ({ e, d: dist(tank.pos, e.pos) })).sort((a, b) => a.d - b.d);
      if (enemies.length > 0) target = enemies[0].e;
    }
    
    tank.currentTarget = target;
    tank.lastTactic = decision.tactic;
    tank.lastAction = decision.action.slice();
    tank.lastTacticsProbs = decision.tacticsProbs.slice();
    tank.lastTargetIdx = decision.targetIdx;
    tank.lastTargetScores = decision.targetScores.slice();
    tank.lastTargetProbs = decision.targetProbs.slice();
    tank.lastValue = decision.value;
    
    // Advanced Steering Behavior
    let desiredAngle = tank.angle;
    let speedMult = 0.5;
    
    if (target) {
      const toTarget = Math.atan2(target.pos.y - tank.pos.y, target.pos.x - tank.pos.x);
      const d = dist(tank.pos, target.pos);
      
      // Predictive intercept
      const interceptTime = d / 7;
      const predX = target.pos.x + target.vel.x * interceptTime;
      const predY = target.pos.y + target.vel.y * interceptTime;
      const pursuitAng = Math.atan2(predY - tank.pos.y, predX - tank.pos.x);
      
      switch (decision.tactic) {
        case 0: desiredAngle = toTarget; speedMult = 1.0; break; // Attack
        case 1: case 2: // Flank
          const side = decision.tactic === 1 ? -1 : 1;
          desiredAngle = d > 250 ? toTarget : normAng(toTarget + Math.PI / 2 * side);
          speedMult = 0.8; break;
        case 3: // Distance
          const err = (d - 240) / 240;
          desiredAngle = normAng(toTarget + clamp(err, -0.5, 0.5));
          speedMult = 0.7; break;
        case 4: // Dodge
          desiredAngle = Math.atan2(decision.action[4], decision.action[3]);
          speedMult = 1.2; break;
        case 5: // Retreat
          desiredAngle = normAng(toTarget + Math.PI);
          speedMult = 0.9; break;
        case 6: // Cover
          desiredAngle = normAng(toTarget + Math.PI);
          speedMult = 0.4; break;
        case 7: // Patrol
          desiredAngle = tank.wanderAng; tank.wanderAng += 0.03;
          speedMult = 0.5; break;
      }
      
      // Blend with pursuit
      desiredAngle = normAng(desiredAngle + angDiff(pursuitAng, desiredAngle) * 0.4);
      
      // Smooth turret rotation
      const leadAim = sim.combatCore.calculateLeadShot(tank, target, 7);
      const desiredAim = leadAim + clamp(decision.action[1], -1, 1) * 0.3;
      tank.turret += clamp(angDiff(desiredAim, tank.turret), -tank.maxAngularVel, tank.maxAngularVel);
      
      // Fire logic
      const aimError = Math.abs(angDiff(tank.turret, leadAim));
      const fireProb = clamp((1 - aimError / 0.3) * 0.8 + decision.action[2] * 0.2, 0, 1);
      
      if (tank.reload <= 0 && tank.rng.next() < fireProb && sim.combatCore.isLineOfSightClear(tank, target, sim.tanks)) {
        tank.reload = tank.reloadTime; tank.shots++;
        const bx = tank.pos.x + Math.cos(tank.turret) * 24;
        const by = tank.pos.y + Math.sin(tank.turret) * 24;
        sim.bullets.push(new Bullet(bx, by, Math.cos(tank.turret) * 7, Math.sin(tank.turret) * 7, tank.team, 12, sim.tick));
      }
    } else {
      tank.turret += clamp(angDiff(tank.wanderAng, tank.turret), -tank.maxAngularVel, tank.maxAngularVel);
    }
    
    // Apply physics
    const force = new Vector2(Math.cos(desiredAngle), Math.sin(desiredAngle));
    force.mult(tank.maxForce * speedMult);
    tank.acc.add(force);
    
    tank.vel.add(tank.acc);
    if (tank.vel.mag() > tank.maxSpeed) {
      tank.vel.normalize().mult(tank.maxSpeed);
    }
    tank.vel.mult(0.92); // Friction
    tank.acc.mult(0); // Reset acc
    
    const nextPos = new Vector2(tank.pos.x + tank.vel.x, tank.pos.y + tank.vel.y);
    let blocked = false;
    if (pointInWall(nextPos.x, nextPos.y, sim.walls) || nextPos.x < 16 || nextPos.x > sim.AW - 16 || nextPos.y < 16 || nextPos.y > sim.AH - 16) {
      blocked = true; tank.vel.mult(-0.5); tank.wanderAng += Math.PI;
    }
    for (const other of sim.tanks) {
      if (other.id !== tank.id && other.alive && dist(nextPos, other.pos) < 32) {
        blocked = true; tank.vel.mult(-0.5);
      }
    }
    if (!blocked) { tank.pos = nextPos; }
    tank.angle = normAng(tank.angle + angDiff(desiredAngle, tank.angle) * 0.2);
    
    // Trajectory recording
    tank.trajectory.push({
      state: sensors, tactic: decision.tactic, value: decision.value,
      tacticsProbs: decision.tacticsProbs, action: decision.action,
      actionSamples: decision.actionSamples, lowLogProb: decision.lowLogProb,
      targetIdx: decision.targetIdx, targetScores: decision.targetScores,
      targetProbs: decision.targetProbs, validCount: decision.validCount,
      enemyFeatures: decision.enemyFeatures, reward: 0, tick: sim.tick
    });
    
    if (tank.trajectory.length > 1500) {
      const chunk = tank.trajectory.splice(0, 1000);
      sim.trajectoryBuffer.addEpisode(chunk, sharedPolicy.forwardValue(chunk[chunk.length - 1].state));
    }
    
    tank.trail.push({ x: tank.pos.x, y: tank.pos.y });
    if (tank.trail.length > 30) tank.trail.shift();
  }
  
  // Bullet physics
  for (let i = sim.bullets.length - 1; i >= 0; i--) {
    const b = sim.bullets[i];
    b.pos.add(b.vel);
    let dead = false;
    if (--b.life <= 0 || b.pos.x < 0 || b.pos.x > sim.AW || b.pos.y < 0 || b.pos.y > sim.AH) dead = true;
    if (!dead && pointInWall(b.pos.x, b.pos.y, sim.walls)) dead = true;
    
    if (!dead) {
      for (const tank of sim.tanks) {
        if (!tank.alive || tank.team === b.team) continue;
        if (dist(tank.pos, b.pos) < 16) {
          const shooter = sim.tanks.find(t => t.alive && t.team === b.team && t.shots > 0); // Simplified owner lookup
          if (shooter) {
            shooter.damage += b.dmg; shooter.hits++;
            const shotTr = shooter.trajectory.find(t => t.tick === b.shotTick);
            if (shotTr) shotTr.reward += R_HIT;
            else if (shooter.trajectory.length > 0) shooter.trajectory[shooter.trajectory.length - 1].reward += R_HIT;
          }
          if (tank.trajectory.length > 0) tank.trajectory[tank.trajectory.length - 1].reward += R_DAMAGE * b.dmg;
          tank.hp -= b.dmg; tank.recentDamage += b.dmg;
          dead = true;
          if (tank.hp <= 0) killTank(tank, b.team);
          break;
        }
      }
    }
    if (dead) sim.bullets.splice(i, 1);
  }
  
  // Reward shaping
  for (const tank of sim.tanks) {
    if (!tank.alive || tank.trajectory.length === 0) continue;
    const tr = tank.trajectory;
    const last = tr[tr.length - 1];
    last.reward += R_LIFE;
    if (tank.currentTarget) {
      const aimErr = Math.abs(angDiff(tank.turret, Math.atan2(tank.currentTarget.pos.y - tank.pos.y, tank.currentTarget.pos.x - tank.pos.x)));
      const d = dist(tank.pos, tank.currentTarget.pos);
      if (aimErr < 0.25) last.reward += R_AIM;
      if (d > 200 && d < 320) last.reward += R_DIST;
    }
    if (tr.length >= 2) {
      if (tr[tr.length - 2].state[BULLET_OFF + 0] > 0.3 && last.state[BULLET_OFF + 0] < 0.1) last.reward += R_DODGE;
    }
  }
}

function killTank(tank, killerTeam) {
  sim.combatCore.targetAssignments.delete(tank.id);
  if (tank.trajectory.length > 0) tank.trajectory[tank.trajectory.length - 1].reward += R_DEATH;
  sim.trajectoryBuffer.addEpisode(tank.trajectory, 0);
  tank.alive = false; tank.hp = 0; tank.deaths++; tank.respawn = 130; tank.trajectory = [];
  
  const killer = sim.tanks.find(t => t.alive && t.team === killerTeam);
  if (killer) {
    killer.kills++;
    if (killer.trajectory.length > 0) killer.trajectory[killer.trajectory.length - 1].reward += R_KILL;
    addLog(`💀 ${killer.name} уничтожил ${tank.name}`, 'log-k');
  }
}

function respawn(tank) {
  sim.combatCore.targetAssignments.delete(tank.id);
  const pos = findSpawn(tank.rng);
  tank.pos = new Vector2(pos.x, pos.y); tank.hp = tank.maxHp; tank.alive = true;
  tank.angle = tank.rng.next() * TAU; tank.turret = tank.angle;
  tank.vel = new Vector2(0, 0); tank.acc = new Vector2(0, 0);
  tank.reload = 0; tank.trail = []; tank.trajectory = []; tank.recentDamage = 0;
  addLog(`↻ ${tank.name} развернут`, 'log-s');
}

function endRound() {
  for (const tank of sim.tanks) {
    if (tank.trajectory.length > 0) {
      let bootstrap = 0;
      if (tank.alive && tank.trajectory.length > 0) {
        bootstrap = sharedPolicy.forwardValue(tank.trajectory[tank.trajectory.length - 1].state);
        tank.trajectory[tank.trajectory.length - 1].reward += R_WIN;
      }
      sim.trajectoryBuffer.addEpisode(tank.trajectory, bootstrap);
      tank.trajectory = [];
    }
  }
  sim.round++; sim.episode++;
  initRound();
}

/* ═══════════════════════════════════════════════════════════════════════
   8. RENDER ENGINE (High-DPI, Smooth, Tactical)
═══════════════════════════════════════════════════════════════════════ */
let canvas, ctx, dpr;

function initRender() {
  canvas = document.getElementById('c');
  ctx = canvas.getContext('2d', { alpha: false });
  dpr = window.devicePixelRatio || 1;
  window.addEventListener('resize', resize);
  resize();
}

function resize() {
  const wrap = document.getElementById('arena-wrap');
  canvas.width = wrap.clientWidth * dpr;
  canvas.height = wrap.clientHeight * dpr;
  canvas.style.width = wrap.clientWidth + 'px';
  canvas.style.height = wrap.clientHeight + 'px';
}

function render() {
  const W = canvas.width, H = canvas.height;
  ctx.fillStyle = '#050508';
  ctx.fillRect(0, 0, W, H);
  
  const scale = Math.min(W / sim.AW, H / sim.AH) * 0.92;
  const ox = (W - sim.AW * scale) / 2, oy = (H - sim.AH * scale) / 2;
  
  ctx.save();
  ctx.translate(ox, oy);
  ctx.scale(scale, scale);
  
  // Tactical Grid
  ctx.strokeStyle = 'rgba(0, 240, 255, 0.03)';
  ctx.lineWidth = 1 / scale;
  for (let x = 0; x <= sim.AW; x += 50) { ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, sim.AH); ctx.stroke(); }
  for (let y = 0; y <= sim.AH; y += 50) { ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(sim.AW, y); ctx.stroke(); }
  
  ctx.strokeStyle = '#1a1a2e'; ctx.lineWidth = 2 / scale; ctx.strokeRect(0, 0, sim.AW, sim.AH);
  
  // Walls
  for (const w of sim.walls) {
    ctx.fillStyle = '#0f0f1a'; ctx.fillRect(w.x, w.y, w.w, w.h);
    ctx.strokeStyle = '#2a2a4e'; ctx.lineWidth = 1 / scale; ctx.strokeRect(w.x, w.y, w.w, w.h);
    // Wall highlight
    ctx.fillStyle = 'rgba(255,255,255,0.02)'; ctx.fillRect(w.x, w.y, w.w, 2);
  }
  
  // Trails
  for (const t of sim.tanks) {
    if (!t.alive || t.trail.length < 2) continue;
    ctx.beginPath(); ctx.moveTo(t.trail[0].x, t.trail[0].y);
    for (let i = 1; i < t.trail.length; i++) ctx.lineTo(t.trail[i].x, t.trail[i].y);
    ctx.strokeStyle = t.color + '22'; ctx.lineWidth = 4; ctx.lineCap = 'round'; ctx.stroke();
  }
  
  // Bullets
  for (const b of sim.bullets) {
    ctx.fillStyle = b.team === 'blue' ? '#00f0ff' : '#ff2a2a';
    ctx.shadowBlur = 8; ctx.shadowColor = ctx.fillStyle;
    ctx.beginPath(); ctx.arc(b.pos.x, b.pos.y, 3, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0;
  }
  
  const selT = sim.tanks[sim.selected];
  
  // Tanks
  for (const t of sim.tanks) {
    if (!t.alive) {
      ctx.globalAlpha = 0.3; ctx.strokeStyle = t.color; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.moveTo(t.pos.x - 8, t.pos.y - 8); ctx.lineTo(t.pos.x + 8, t.pos.y + 8);
      ctx.moveTo(t.pos.x + 8, t.pos.y - 8); ctx.lineTo(t.pos.x - 8, t.pos.y + 8); ctx.stroke();
      ctx.globalAlpha = 1; continue;
    }
    
    const R = 16;
    
    // Selection & Targeting lines
    if (t === selT && t.currentTarget && t.currentTarget.alive) {
      ctx.strokeStyle = t.color + '66'; ctx.lineWidth = 1.5; ctx.setLineDash([4, 4]);
      ctx.beginPath(); ctx.moveTo(t.pos.x, t.pos.y); ctx.lineTo(t.currentTarget.pos.x, t.currentTarget.pos.y); ctx.stroke();
      ctx.setLineDash([]);
      
      // Predictive aim point visualization
      const tLead = dist(t.pos, t.currentTarget.pos) / 7;
      const aimX = t.currentTarget.pos.x + t.currentTarget.vel.x * tLead;
      const aimY = t.currentTarget.pos.y + t.currentTarget.vel.y * tLead;
      ctx.strokeStyle = '#ffffff44'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.arc(aimX, aimY, 6, 0, TAU); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(aimX - 8, aimY); ctx.lineTo(aimX + 8, aimY); ctx.moveTo(aimX, aimY - 8); ctx.lineTo(aimX, aimY + 8); ctx.stroke();
    }
    
    // Sensor visualization (only for selected)
    if (t === selT) {
      for (let i = 0; i < N_LIDAR; i++) {
        const a = t.angle + (i / N_LIDAR) * TAU;
        const hitDist = raycastWalls(t.pos, a, 160, sim.walls, sim.AW, sim.AH);
        const endX = t.pos.x + Math.cos(a) * hitDist;
        const endY = t.pos.y + Math.sin(a) * hitDist;
        
        const grad = ctx.createLinearGradient(t.pos.x, t.pos.y, endX, endY);
        grad.addColorStop(0, t.color + '88');
        grad.addColorStop(1, t.color + '00');
        ctx.strokeStyle = grad; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(t.pos.x, t.pos.y); ctx.lineTo(endX, endY); ctx.stroke();
      }
    }
    
    // Tank Body
    ctx.save(); ctx.translate(t.pos.x, t.pos.y); ctx.rotate(t.angle);
    ctx.fillStyle = '#0a0a12'; ctx.strokeStyle = t.color; ctx.lineWidth = 2;
    ctx.shadowBlur = 10; ctx.shadowColor = t.color;
    ctx.beginPath();
    ctx.moveTo(R, 0); ctx.lineTo(-R * 0.6, -R * 0.8); ctx.lineTo(-R, -R * 0.5);
    ctx.lineTo(-R, R * 0.5); ctx.lineTo(-R * 0.6, R * 0.8); ctx.closePath();
    ctx.fill(); ctx.stroke();
    ctx.shadowBlur = 0;
    
    // Engine glow
    ctx.fillStyle = t.color + '44';
    ctx.fillRect(-R * 0.8, -R * 0.4, R * 0.4, R * 0.8);
    ctx.restore();
    
    // Turret
    ctx.save(); ctx.translate(t.pos.x, t.pos.y); ctx.rotate(t.turret);
    ctx.fillStyle = t.color; ctx.shadowBlur = 6; ctx.shadowColor = t.color;
    ctx.fillRect(0, -3, R + 8, 6);
    ctx.beginPath(); ctx.arc(0, 0, 7, 0, TAU); ctx.fill();
    ctx.shadowBlur = 0; ctx.restore();
    
    // Health Bar
    const hpw = 32; const hpy = t.pos.y - R - 12;
    ctx.fillStyle = '#00000088'; ctx.fillRect(t.pos.x - hpw / 2 - 1, hpy - 1, hpw + 2, 6);
    const hpr = t.hp / t.maxHp;
    ctx.fillStyle = hpr > 0.6 ? '#00ff9d' : hpr > 0.3 ? '#fbbf24' : '#ff2a2a';
    ctx.fillRect(t.pos.x - hpw / 2, hpy, hpw * hpr, 4);
    
    // Name & ID
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 10px monospace'; ctx.textAlign = 'center';
    ctx.fillText(t.name, t.pos.x, t.pos.y + R + 16);
    
    if (t === selT) {
      ctx.strokeStyle = t.color; ctx.lineWidth = 1.5; ctx.setLineDash([3, 3]);
      ctx.beginPath(); ctx.arc(t.pos.x, t.pos.y, R + 8, 0, TAU); ctx.stroke();
      ctx.setLineDash([]);
    }
  }
  
  ctx.restore();
}

/* ═══════════════════════════════════════════════════════════════════════
   9. UI & MAIN LOOP
═══════════════════════════════════════════════════════════════════════ */
function updateUI() {
  document.getElementById('h-ep').textContent = sim.episode;
  document.getElementById('h-rnd').textContent = sim.round;
  document.getElementById('h-train').textContent = trainer ? trainer.trainSteps : 0;
  
  let html = '';
  for (const t of sim.tanks) {
    const hp = (t.hp / t.maxHp * 100) | 0;
    const hpc = t.hp / t.maxHp > 0.6 ? '#00ff9d' : t.hp / t.maxHp > 0.3 ? '#fbbf24' : '#ff2a2a';
    html += `<div class="tank-card ${t.team} ${t.id === sim.selected ? 'sel' : ''}" data-id="${t.id}">
      <div class="tc-top">
        <span class="dot" style="background:${t.color}; color:${t.color}"></span>
        <span class="tc-name">${t.name}</span>
        <span class="team-tag ${t.team}">${t.team === 'blue' ? 'СОЮЗ' : 'ВРАГ'}</span>
      </div>
      <div class="hp-bar"><div class="hp-fill" style="width:${hp}%;background:${hpc}"></div></div>
      <div class="tc-row"><span>K/D</span><b>${t.kills}/${t.deaths}</b></div>
      <div class="tc-row"><span>Урон</span><b>${t.damage | 0}</b></div>
      <div class="tc-row"><span>Точность</span><b>${t.shots ? ((t.hits / t.shots * 100) | 0) + '%' : '—'}</b></div>
    </div>`;
  }
  const tankList = document.getElementById('tank-list');
  if (tankList) {
    tankList.innerHTML = html;
    tankList.querySelectorAll('.tank-card').forEach(c => c.onclick = () => { sim.selected = +c.dataset.id; });
  }
  
  const t = sim.tanks[sim.selected];
  const panel = document.getElementById('brain-panel');
  if (panel && t && t.lastTacticsProbs.length > 0) {
    const probs = t.lastTacticsProbs;
    let policyHtml = '';
    let bestIdx = 0, bestV = -1;
    for (let i = 0; i < N_TACTICS; i++) if (probs[i] > bestV) { bestV = probs[i]; bestIdx = i; }
    for (let i = 0; i < N_TACTICS; i++) {
      policyHtml += `<div class="policy-row ${i === bestIdx ? 'top' : ''}">
        <span class="policy-label">${TACTICS_NAMES[i]}</span>
        <div class="policy-bar"><div class="policy-fill" style="width:${probs[i] * 100}%;background:${t.color}"></div></div>
        <span class="policy-val">${(probs[i] * 100).toFixed(1)}%</span>
      </div>`;
    }
    
    let targetHtml = '<div style="color:var(--text-dim);font-size:9px">Нет целей</div>';
    if (t.lastTargetScores) {
      const enemies = sim.tanks.filter(tt => tt.alive && tt.team !== t.team).map(e => ({ e, d: dist(t.pos, e.pos) })).sort((a, b) => a.d - b.d);
      let rows = '';
      for (let k = 0; k < MAX_ENEMIES; k++) {
        if (k >= enemies.length) break;
        const sc = t.lastTargetScores[k];
        const e = enemies[k].e;
        rows += `<div class="policy-row ${k === t.lastTargetIdx ? 'top' : ''}">
          <span class="policy-label" style="color:${e.color}">${e.name}</span>
          <div class="policy-bar"><div class="policy-fill" style="width:${clamp(sc * 30 + 50, 0, 100)}%;background:${e.color}"></div></div>
          <span class="policy-val">${sc.toFixed(2)}</span>
        </div>`;
      }
      if (rows) targetHtml = rows;
    }
    
    panel.innerHTML = `
      <div class="bp-section"><div class="bp-title">Тактическое решение</div>${policyHtml}</div>
      <div class="bp-section"><div class="bp-title">Приоритет целей</div>${targetHtml}</div>
      <div class="bp-section"><div class="bp-title">Оценка состояния V(s)</div><div style="color:var(--accent-green); font-size:14px; font-weight:700">${t.lastValue.toFixed(3)}</div></div>
    `;
  }
  
  if (trainer) {
    const m = trainer.lastMetrics;
    document.getElementById('metrics').innerHTML = `
      <div class="tc-row"><span>Policy Loss</span><b>${m.policyLoss.toFixed(4)}</b></div>
      <div class="tc-row"><span>Value Loss</span><b>${m.valueLoss.toFixed(4)}</b></div>
      <div class="tc-row"><span>Entropy</span><b>${m.entropy.toFixed(4)}</b></div>
      <div class="tc-row"><span>Buffer Size</span><b>${sim.trajectoryBuffer.size()}</b></div>
    `;
  }
  
  document.getElementById('log').innerHTML = sim.log.slice(0, 25).map(e => `<div class="${e.cls}">[${e.t.toString().padStart(4, '0')}] ${e.msg}</div>`).join('');
}

let fps = 0, frames = 0, lastFps = performance.now();
let isTraining = false;

function loop(timestamp) {
  requestAnimationFrame(loop);
  
  // Fixed timestep physics
  if (sim.running) {
    const dt = 1 / 60;
    sim.accumulator += dt * sim.speed;
    while (sim.accumulator >= dt) {
      updatePhysics(dt);
      sim.accumulator -= dt;
    }
    
    // Non-blocking training
    if (!isTraining && sim.trajectoryBuffer.size() > 300) {
      isTraining = true;
      trainer.trainStepAsync(sim.trajectoryBuffer, 12).then(() => {
        isTraining = false;
      });
    }
  }
  
  render();
  frames++;
  const now = performance.now();
  if (now - lastFps >= 1000) {
    fps = frames; frames = 0; lastFps = now;
    const el = document.getElementById('h-fps');
    if (el) {
      el.textContent = fps;
      el.style.color = fps >= 55 ? 'var(--accent-green)' : fps >= 30 ? '#fbbf24' : 'var(--accent-red)';
    }
  }
  if (Math.floor(timestamp / 100) % 6 === 0) updateUI();
}

function setupControls() {
  document.getElementById('btn-go').onclick = function () {
    sim.running = !sim.running;
    this.textContent = sim.running ? '⏸ PAUSE' : '▶ START';
    this.classList.toggle('primary', !sim.running);
  };
  
  document.getElementById('btn-train').onclick = () => {
    if (sim.trajectoryBuffer.size() < 200) { alert('Недостаточно данных в буфере для обучения.'); return; }
    addLog('🧠 Запуск форсированного обучения...', 'log-l');
    for (let i = 0; i < 10; i++) trainer.trainStepAsync(sim.trajectoryBuffer, 50);
    updateUI();
  };
  
  document.getElementById('btn-rst').onclick = () => {
    sim.running = false; sim.round = 1; sim.episode = 0; sim.tick = 0; sim.log = [];
    sim.trajectoryBuffer.clear(); sim.accumulator = 0;
    initBrain(); initRound();
    const btn = document.getElementById('btn-go');
    btn.textContent = '▶ START'; btn.classList.add('primary');
    updateUI();
  };
  
  document.getElementById('sel-spd').onchange = e => { sim.speed = +e.target.value; };
  
  canvas.addEventListener('click', e => {
    const r = canvas.getBoundingClientRect();
    const scale = Math.min(canvas.width / sim.AW, canvas.height / sim.AH) * 0.92;
    const ox = (canvas.width - sim.AW * scale) / 2, oy = (canvas.height - sim.AH * scale) / 2;
    const x = ((e.clientX - r.left) * dpr - ox) / scale;
    const y = ((e.clientY - r.top) * dpr - oy) / scale;
    let best = null, bd = 40;
    for (const t of sim.tanks) { const d = dist(t.pos, {x, y}); if (d < bd) { bd = d; best = t; } }
    if (best) sim.selected = best.id;
  });
}

window.addEventListener('DOMContentLoaded', () => {
  initRender();
  initBrain();
  initRound();
  setupControls();
  updateUI();
  requestAnimationFrame(loop);
});
</script>
</body>
